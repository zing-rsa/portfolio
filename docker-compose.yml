# Local development Postgres. The app itself runs on the host via `bun dev`
# (fast HMR); migrations/seed are run from the host against this DB. The
# production image is built from the Dockerfile and deployed to Kubernetes.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      # Host port is overridable so it can coexist with another local Postgres.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
