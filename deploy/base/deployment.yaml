apiVersion: apps/v1
kind: Deployment
metadata: { name: portfolio, labels: { app: portfolio } }
spec:
  replicas: 1
  selector: { matchLabels: { app: portfolio } }
  template:
    metadata:
      labels: { app: portfolio }
      # resource.opentelemetry.io/* annotations are lifted to OTel resource attributes by
      # Alloy's k8sattributes processor, so logs carry the same service.name as traces.
      annotations:
        resource.opentelemetry.io/service.name: portfolio
    spec:
      imagePullSecrets: [{ name: ghcr }]
      initContainers:
        - name: migrate
          image: ghcr.io/zing-rsa/portfolio
          # distroless has no shell and `node` is not on PATH; call it directly.
          command: ["/nodejs/bin/node", "migrate.mjs"]
          envFrom:
            - secretRef: { name: portfolio-app }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      containers:
        - name: portfolio
          image: ghcr.io/zing-rsa/portfolio
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: portfolio-app }
          env:
            # OTLP traces -> Alloy (observability ns), which forwards to Tempo.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://alloy.observability.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: portfolio }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }