apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: portfolio-db }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: portfolio-db
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG only watches password Secrets carrying this label; without it a rotated
          # password is never applied to the managed role until the Cluster is reconciled.
          cnpg.io/reload: "true"
  data:
    - { secretKey: username, remoteRef: { key: apps/portfolio/prod, property: db-username } }
    - { secretKey: password, remoteRef: { key: apps/portfolio/prod, property: db-password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: portfolio-app }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: portfolio-app
    template:
      data:
        DATABASE_URL: "postgres://portfolio:{{ .dbPassword }}@pg-rw.prod.svc:5432/portfolio?sslmode=require"
        SESSION_SECRET: "{{ .sessionSecret }}"
        GITHUB_TOKEN: "{{ .githubToken }}"
  data:
    - { secretKey: dbPassword, remoteRef: { key: apps/portfolio/prod, property: db-password } }
    - { secretKey: sessionSecret, remoteRef: { key: apps/portfolio/prod, property: session-secret } }
    - { secretKey: githubToken, remoteRef: { key: apps/portfolio/prod, property: github-token } }